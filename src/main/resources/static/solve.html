<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>独立定位 · RTKLIB Tuning</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/solve.css">
</head>
<body class="solve-page">

<header class="top-bar">
    <div class="brand"><span style="font-size:18px">📡</span><h1>独立定位</h1></div>
    <nav>
        <a href="/" class="nav-link">🛰 参数调试</a>
        <a href="/file.html" class="nav-link">📄 单文件分析</a>
    </nav>
    <button class="theme-btn" onclick="Solve.toggleTheme()">☀</button>
</header>

<div class="solve-layout">

    <!-- 模式 -->
    <div class="mode-bar">
        <span style="font-size:12px;color:var(--text2);margin-right:4px">定位模式:</span>
        <div id="mode-btns" style="display:flex;gap:8px;flex-wrap:wrap"></div>
        <span class="spacer"></span>
    </div>

    <!-- 文件 -->
    <div class="panel">
        <strong style="font-size:12px;color:var(--text)">📁 文件上传</strong>
        <div class="file-slots" id="file-slots"></div>
    </div>

    <!-- 参数 -->
    <div class="panel">
        <strong style="font-size:12px;color:var(--text)">🎛 参数</strong>
        <div class="param-grid" id="param-grid"></div>
    </div>

    <!-- 运行 -->
    <div class="run-bar">
        <button class="btn primary" id="btn-run" onclick="Solve.run()">▶ 开始定位</button>
        <button class="btn danger" id="btn-stop" onclick="Solve.stop()" style="display:none">⏹ 停止</button>
        <span class="hint" id="run-hint"></span>
        <span class="spacer"></span>
        <button class="btn sm" onclick="Solve.clearResults()">清空结果</button>
    </div>

    <!-- 结果 -->
    <div id="result-area">
        <div class="result-title">📊 定位结果</div>

        <div class="stat-row" id="solve-stats"></div>

        <div class="chart-box">
            <div class="chart-label">解状态时序</div>
            <canvas id="cv-fix" height="60"></canvas>
        </div>

        <div class="chart-box">
            <div class="chart-label">坐标偏差 (N/E/U) · 相对 Fixed 均值</div>
            <canvas id="cv-dev" height="150"></canvas>
        </div>

        <div class="chart-box">
            <div class="chart-label">Ratio 时序 · 固定解质量</div>
            <canvas id="cv-ratio" height="100"></canvas>
        </div>

        <div class="chart-box">
            <div class="chart-label">卫星数 &amp; PDOP</div>
            <canvas id="cv-satpdop" height="100"></canvas>
        </div>
    </div>

    <!-- 日志 -->
    <div class="log-panel" id="log-panel">
        <div class="line">等待上传文件...</div>
    </div>

</div>

<div id="toast" class="toast hidden"></div>

<script src="/js/utils.js"></script>
<script src="/js/solve.js"></script>
</body>
</html>
